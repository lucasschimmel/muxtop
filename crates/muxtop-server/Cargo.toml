[package]
name = "muxtop-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TCP server daemon for muxtop remote system monitoring"
rust-version.workspace = true

[[bin]]
name = "muxtop-server"
path = "src/main.rs"

[dependencies]
muxtop-core = { workspace = true }
muxtop-proto = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
time = "0.3"
# k8s-openapi v1_32 feature is enabled here (binary leaf) so muxtop-core's
# typed Pod/Node/Deployment imports resolve. See Cargo.toml workspace dep.
k8s-openapi = { workspace = true, features = ["v1_32"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
x509-parser = "0.18"
