[package]
name = "muxtop-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core data collection engine for muxtop"
rust-version.workspace = true

[dependencies]
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }

# NVML has no macOS build (NVIDIA dropped Apple after Kepler), so the NVIDIA
# backend — and its dependency — exist only where the library can be loaded.
# The `amd_engine` module deliberately stays un-gated: it is plain file I/O,
# and keeping it compiled everywhere keeps its parser tests running on every
# CI target (cf. the v0.4.2 Windows build break).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { workspace = true }

# Apple Silicon backend (v0.7). `core-foundation` gives the Core Foundation
# container types IOKit speaks in, with the retain/release rules encoded in the
# type system rather than in comments. `libloading` resolves the IOReport
# symbols at runtime — the same treatment NVML gets, and for the same reason:
# muxtop must run unchanged where the library is absent or has moved on.
# IOKit itself is a public system framework and is linked directly.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }
libloading = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
tempfile = "3"
# k8s-openapi v1_32 feature is enabled here so unit/integration tests have
# the typed API objects available; the library itself (above) declares no
# version feature per k8s-openapi's library guideline.
k8s-openapi = { workspace = true, features = ["v1_32"] }

[[bench]]
name = "process_bench"
harness = false

[[bench]]
name = "snapshot_bench"
harness = false

[[bench]]
name = "network_bench"
harness = false

[[bench]]
name = "kube_bench"
harness = false

[[bench]]
name = "gpu_bench"
harness = false
