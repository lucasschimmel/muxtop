[workspace]
members = ["crates/muxtop-core", "crates/muxtop-tui", "crates/muxtop-proto", "crates/muxtop-server"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.package]
edition = "2024"
version = "0.7.0"
authors = ["Lucas Schimmel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucasschimmel/muxtop"
description = "A modern, multiplexed system monitor for the terminal"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }

# System information
sysinfo = "0.38"

# NVIDIA GPU telemetry (v0.5). Loads libnvidia-ml.so / nvml.dll dynamically at
# runtime via libloading, so muxtop builds and runs unchanged on hosts with no
# NVIDIA driver. Target-gated in muxtop-core: NVML has no macOS build.
nvml-wrapper = "0.12"

# Apple Silicon GPU telemetry (v0.7). Target-gated in muxtop-core to macOS:
# `core-foundation` wraps the Core Foundation types IOKit exchanges, and
# `libloading` resolves the private IOReport symbols at runtime so the binary
# still starts on a macOS release that has moved them.
core-foundation = "0.10"
core-foundation-sys = "0.8"
libloading = "0.8"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Fuzzy matching
nucleo = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

# System
libc = "0.2"

# Async utilities
tokio-util = { version = "0.7", features = ["rt"] }

# Utilities
dirs = "6"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Serialization
# `rc` lets Serialize/Deserialize see through the `Arc`s on
# `SystemSnapshot`'s container and cluster fields (PERF-02).
serde = { version = "1", features = ["derive", "rc"] }
bincode = "2"

# Async trait (dyn-safe async fn in trait — see ADR-01 in forge/24)
async-trait = "0.1"

# Docker/Podman API client (v0.3 Containers, see ADR-01 in forge/25)
bollard = "0.21"
futures = "0.3"

# Kubernetes API client (v0.4 Kube tab, see ADR-04 in forge/32) — features
# trimmed to keep binary footprint controlled (see plan T-810/T-820).
# k8s-openapi forbids library crates from enabling its v1_* features; only
# the leaf binaries (muxtop, muxtop-server) and the muxtop-core dev-deps
# enable `v1_32`. The library lines below intentionally carry no features.
#
# `ring` is listed explicitly because `default-features = false` drops it:
# kube 4's defaults are `client, rustls-tls, ring`, so turning
# defaults off to trim the feature set also silently deselected the crypto
# provider — see the `tokio-rustls` note below for what filled the gap.
# Stay on kube 4.0.x: 4.2 requires Rust 1.89, above our MSRV.
# No runtime feature: this engine polls directly via Api, without reflectors.
kube = { version = "~4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
k8s-openapi = { version = "0.28" }

# HTTP types — used by KubeEngine metrics polling (request_text); already a
# transitive dep via kube-client, declared explicitly here for clarity.
http = "1"

# JSON parsing — used by KubeEngine metrics-server response parsing (S2.5).
serde_json = "1"

# TLS
#
# The crypto provider is pinned to `ring`, and `default-features = false` is
# what pins it: tokio-rustls 0.26's defaults are `logging, tls12, aws_lc_rs`,
# and `aws_lc_rs` forwards to `rustls/aws_lc_rs`. Because Cargo unifies
# features across the graph, that one default put aws-lc-rs into the same
# `rustls` that kube-client and hyper-rustls share — 927 KiB of C and assembly,
# including ML-DSA and ML-KEM code no muxtop handshake can reach. Nothing in
# this workspace ever asked for it. Selecting `ring` here and on `kube` above
# takes 1.375 MiB off the release binary (8.03 -> 6.66 MiB) and drops
# aws-lc-sys from the graph entirely, at the cost of post-quantum key exchange.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = "1"
rcgen = "0.14"
ring = "0.17"

# Internal crates
muxtop-core = { path = "crates/muxtop-core", version = "0.7.0" }
muxtop-tui = { path = "crates/muxtop-tui", version = "0.7.0" }
muxtop-proto = { path = "crates/muxtop-proto", version = "0.7.0" }

[package]
name = "muxtop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
rust-version.workspace = true
default-run = "muxtop"

[[bin]]
name = "muxtop"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Lucas Schimmel"
copyright = "2026 Lucas Schimmel"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/muxtop", "usr/bin/", "755"],
]
extended-description = "A modern, multiplexed system monitor for the terminal. Features real-time CPU, memory, disk, and network monitoring with a TUI interface, process tree view, and fuzzy search."

[dependencies]
muxtop-core = { workspace = true }
muxtop-tui = { workspace = true }
muxtop-proto = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
# k8s-openapi v1_32 feature is enabled here (binary leaf) so muxtop-core's
# typed Pod/Node/Deployment imports resolve. See workspace dep.
k8s-openapi = { workspace = true, features = ["v1_32"] }
