name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Publishing a release, pushing the Homebrew formula and
# signing provenance each need more than that, and each says so on its own job
# — so a compromised build step cannot reach the release, and a compromised
# release step cannot mint an attestation.
permissions:
  contents: read

concurrency:
  # Two pushes of the same tag must never race to publish the same version.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is the one input to this pipeline that nothing validates, and it is
  # the one that cannot be taken back: the Homebrew formula, the APT repo and
  # crates.io all derive their version from it, and crates.io publishes are
  # permanent. Fail here, before anything leaves the runner, rather than
  # halfway through with two package managers already updated.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match the workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "muxtop") | .version')

          echo "tag=${TAG_VERSION} Cargo.toml=${CARGO_VERSION}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${CARGO_VERSION}. Bump Cargo.toml or retag."
            exit 1
          fi

      - name: CHANGELOG must document this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^#+ \[?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}. The generated release notes are not a substitute for a curated entry."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Both required to mint a build-provenance attestation, which lets a
      # user run `gh attestation verify muxtop-<target>.tar.gz --repo
      # lucasschimmel/muxtop` and get a cryptographic answer to "was this
      # binary built by that workflow from that commit" — the question a
      # published SHA256 alone cannot answer, since an attacker who can
      # replace the archive can replace the .sha256 next to it.
      id-token: write
      attestations: write
    strategy:
      # One target failing must not cancel the other three: a release that
      # ships three of four platforms is a decision, not an accident, and the
      # logs of the survivors say whether the break is target-specific.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Required now that the action is pinned by SHA — see the same note
          # in ci.yml.
          toolchain: stable
          targets: ${{ matrix.target }}

      # `cargo install cross --locked` compiles cross from source on every
      # release, for every Linux target. install-action fetches the upstream
      # prebuilt binary and verifies its checksum instead.
      - name: Install cross (Linux)
        if: contains(matrix.target, 'linux')
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cross

      - name: Build (Linux via cross)
        if: contains(matrix.target, 'linux')
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS native)
        if: contains(matrix.target, 'apple')
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          BINARY="target/${{ matrix.target }}/release/muxtop"
          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            docker run --rm -v "$PWD:/workspace" -w /workspace \
              messense/rust-musl-cross:${{ matrix.target }} \
              strip "$BINARY" 2>/dev/null || true
          else
            strip "$BINARY" 2>/dev/null || true
          fi

      - name: Create archive
        run: |
          BINARY="target/${{ matrix.target }}/release/muxtop"
          ARCHIVE="muxtop-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" muxtop
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Install cargo-deb (Linux)
        if: contains(matrix.target, 'linux')
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deb

      - name: Build .deb package
        if: contains(matrix.target, 'linux')
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb muxtop-${{ matrix.target }}.deb
          shasum -a 256 muxtop-${{ matrix.target }}.deb > muxtop-${{ matrix.target }}.deb.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            muxtop-${{ matrix.target }}.tar.gz
            muxtop-${{ matrix.target }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muxtop-${{ matrix.target }}
          path: |
            muxtop-${{ matrix.target }}.tar.gz
            muxtop-${{ matrix.target }}.tar.gz.sha256
            muxtop-${{ matrix.target }}.deb
            muxtop-${{ matrix.target }}.deb.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only job in this workflow that writes to this repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.sha256
            scripts/install.sh

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    # Writes to lucasschimmel/homebrew-tap with a PAT, so this job needs no
    # permission at all on *this* repository.
    permissions: {}
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucasschimmel/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release checksums
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/lucasschimmel/muxtop/releases/download/${TAG}"
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            curl -sL "${BASE_URL}/muxtop-${target}.tar.gz.sha256" -o "${target}.sha256"
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Update formula
        run: |
          SHA_AARCH64_MACOS=$(awk '{print $1}' aarch64-apple-darwin.sha256)
          SHA_X86_64_MACOS=$(awk '{print $1}' x86_64-apple-darwin.sha256)
          SHA_AARCH64_LINUX=$(awk '{print $1}' aarch64-unknown-linux-musl.sha256)
          SHA_X86_64_LINUX=$(awk '{print $1}' x86_64-unknown-linux-musl.sha256)

          cat > Formula/muxtop.rb << RUBY
          class Muxtop < Formula
            desc "A modern, multiplexed system monitor for the terminal"
            homepage "https://github.com/lucasschimmel/muxtop"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/lucasschimmel/muxtop/releases/download/v#{version}/muxtop-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_MACOS}"
              end
              on_intel do
                url "https://github.com/lucasschimmel/muxtop/releases/download/v#{version}/muxtop-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_MACOS}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/lucasschimmel/muxtop/releases/download/v#{version}/muxtop-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_AARCH64_LINUX}"
              end
              on_intel do
                url "https://github.com/lucasschimmel/muxtop/releases/download/v#{version}/muxtop-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "muxtop"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/muxtop --version")
            end
          end
          RUBY
          sed -i 's/^          //' Formula/muxtop.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/muxtop.rb
          git commit -m "feat: update muxtop to ${VERSION}"
          git push

  update-apt:
    name: Update APT Repository
    needs: release
    runs-on: ubuntu-latest
    # Dispatches a workflow in lucasschimmel/apt with a PAT — nothing needed
    # on this repository.
    permissions: {}
    steps:
      - name: Trigger APT repo update
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          gh workflow run update-repo.yml \
            --repo lucasschimmel/apt \
            --field version="${VERSION}" \
            --field source_repo="lucasschimmel/muxtop"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # crates.io auth is the registry token, not the GitHub token.
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # `k8s-openapi` (transitive via `kube`) refuses to compile a library
      # crate without a v1_* feature, but equally refuses to let library
      # crates enable one in their `[dependencies]`. The standard fix is
      # dev-deps — but `cargo publish` does not activate dev-deps during its
      # verification build, so `cargo publish --package muxtop-core` fails
      # without this. The k8s-openapi build script honours
      # K8S_OPENAPI_ENABLED_VERSION as the documented escape hatch for this
      # exact case. Pin to the version the workspace targets (matches the
      # v1_32 feature on dev-deps + leaf binaries, see Cargo.toml).
      #
      # Scoped to this job on purpose: the build jobs already get v1_32 from
      # the leaf binaries' features and need no override. Where both apply
      # (publishing `muxtop` itself) the build script de-duplicates the
      # feature and the env var into one version, so matching values are safe.
      K8S_OPENAPI_ENABLED_VERSION: "1.32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Publish order is dependency order, and the sleeps let the crates.io
      # index catch up before the next crate resolves against it. An
      # "already exists" failure is tolerated so a partially-completed
      # publish can be resumed by re-running the job.
      - name: Publish muxtop-core
        run: |
          if out=$(cargo publish --package muxtop-core 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop-proto
        run: |
          if out=$(cargo publish --package muxtop-proto 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop-tui
        run: |
          if out=$(cargo publish --package muxtop-tui 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop
        run: |
          if out=$(cargo publish --package muxtop 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
