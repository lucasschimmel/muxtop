name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    # `main` is required here, not just `develop`. The branch protection on
    # `main` requires all six checks below to pass on the release PR, but a
    # `pull_request` trigger scoped to `develop` alone never produces them on
    # a develop -> main PR — deadlocking every release behind checks that
    # could not run. See PR #18.
    branches: [develop, main]

# Least privilege. Nothing in this workflow writes to the repository, so the
# job token is read-only; a job that needs more must opt in explicitly at the
# job level rather than inheriting a write-capable token by default.
permissions:
  contents: read

# A second push to the same pull request supersedes the first, so cancel the
# in-flight run instead of paying for a result nobody will read. Runs on
# `develop` and `main` are never cancelled: those feed branch protection and
# the release pipeline, and a cancelled required check reads as a failure.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ---------------------------------------------------------------------------
  # Required checks. The names below ("Format", "Clippy", "Cargo Deny",
  # "Test (<os>)", "Bench compile check") are wired into the branch protection
  # on `main` — renaming a job silently removes its gate. Add new jobs freely,
  # but rename an existing one only together with the protection rule.
  # ---------------------------------------------------------------------------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinning the action by SHA means the toolchain can no longer be
          # inferred from the `@stable` ref — `dtolnay/rust-toolchain` defaults
          # its `toolchain` input to `github.action_ref`, which is now the SHA.
          # Every use of this action below therefore names its toolchain.
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform report. Aborting the matrix on the first failure
      # hides whether a break is platform-specific or universal, which is the
      # only question worth asking when one of three targets goes red.
      fail-fast: false
      matrix:
        # Windows is not a release target — `release.yml` publishes musl and
        # darwin binaries only, and the process actions (kill / renice) are
        # POSIX-only stubs there. It is in the matrix purely as a regression
        # guard: an ungated `libc::` call breaks the build for anyone
        # developing on Windows, and that went unnoticed for two releases
        # because nothing here compiled the workspace on it.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace

  bench:
    name: Bench compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo bench --workspace --no-run

  # ---------------------------------------------------------------------------
  # Additional checks. Not yet required by branch protection — promote them
  # once they have proven themselves green over a few releases.
  # ---------------------------------------------------------------------------

  msrv:
    # The version is spelled out in the job name rather than interpolated: the
    # `env` context is not available when a job's `name` is evaluated, so
    # `${{ env.MSRV }}` there renders as an empty string.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml, the job name above, and
      # the MSRV note in README.md / CONTRIBUTING.md. An MSRV nobody compiles
      # is a guess.
      MSRV: "1.88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `--all-targets` is mandatory: it activates the dev-dependencies that
      # enable the `k8s-openapi` v1_31 feature, without which the muxtop-core
      # library build fails. See CONTRIBUTING.md.
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links are the single most common rot in a published
      # crate's documentation, and `cargo doc` only reports them as warnings.
      RUSTDOCFLAGS: -Dwarnings
      # `cargo doc` builds the libraries without dev-dependencies, so the
      # v1_31 feature that `--all-targets` would have supplied is absent here.
      # k8s-openapi's build script honours this env var as its documented
      # escape hatch for exactly that case. See the same note in release.yml.
      K8S_OPENAPI_ENABLED_VERSION: "1.31"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps --document-private-items

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-llvm-cov
      # No third-party coverage service: the number is written to the run
      # summary and the lcov file is kept as an artifact. That keeps the
      # "zero telemetry" promise honest all the way down to the CI, and
      # avoids handing a token to an external host for a public repository.
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  semver:
    name: Semver
    # Only meaningful once there is a published baseline to compare against,
    # and only worth the minutes on a change that could reach crates.io.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # cargo-semver-checks builds rustdoc JSON for each library without
      # dev-dependencies — same k8s-openapi feature gap as the `docs` job.
      K8S_OPENAPI_ENABLED_VERSION: "1.31"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # muxtop-core, muxtop-proto and muxtop-tui are published to crates.io,
      # so their public API is a contract. Under Cargo's 0.x rules a patch
      # bump may not break it; a minor bump may.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: muxtop-core, muxtop-proto, muxtop-tui
