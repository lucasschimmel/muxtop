name: Publish to crates.io (manual)

# Escape hatch for the case where `release.yml` produced the GitHub release
# but its `publish` job failed — a network blip, an index lag, a revoked
# token. Re-running it republishes only what is missing, because an
# "already exists" error from crates.io is tolerated.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two manual publishes of the same commit race.
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `k8s-openapi` (transitive via `kube`) refuses to compile a library crate
  # without a v1_* feature, but it equally refuses to let library crates
  # enable one in their `[dependencies]`. The standard fix is dev-deps —
  # but `cargo publish` does not activate dev-deps during its verification
  # build. The k8s-openapi build script honours K8S_OPENAPI_ENABLED_VERSION
  # as the documented escape hatch for this exact case. Pin to the version
  # the workspace targets (matches the v1_32 feature on dev-deps + leaf
  # binaries, see Cargo.toml).
  K8S_OPENAPI_ENABLED_VERSION: "1.32"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Required now that the action is pinned by SHA — see ci.yml.
          toolchain: stable
      - name: Publish muxtop-core
        run: |
          if out=$(cargo publish --package muxtop-core 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop-proto
        run: |
          if out=$(cargo publish --package muxtop-proto 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop-tui
        run: |
          if out=$(cargo publish --package muxtop-tui 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
          sleep 30
      - name: Publish muxtop
        run: |
          if out=$(cargo publish --package muxtop 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          fi
